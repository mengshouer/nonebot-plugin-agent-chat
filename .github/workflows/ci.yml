name: reusable CI

on:
  workflow_call:
    inputs:
      upload_dist:
        description: Upload the validated distributions for a caller workflow
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Prepare the environment
        run: >-
          uv sync --locked --no-dev --extra render-image --extra adapters
          --extra tui --python "$(command -v python)"
      - name: Run quality checks
        run: ./scripts/check.sh --quality --skip-sync

  runtime:
    name: Runtime tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.10 protects the minimum supported version; 3.x follows the latest
        # stable Python release without requiring a workflow edit every year.
        python-version: ["3.10", "3.x"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Prepare the environment
        run: >-
          uv sync --locked --no-dev --extra render-image --extra adapters
          --extra tui --python "$(command -v python)"
      - name: Install the render browser
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Run runtime checks
        run: ./scripts/check.sh --runtime --skip-sync

  package:
    name: Build and validate package
    needs: [quality, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Prepare the environment
        run: >-
          uv sync --locked --no-dev --extra render-image --extra adapters
          --extra tui --python "$(command -v python)"
      - name: Build and validate distributions
        run: ./scripts/check.sh --package --skip-sync
      - name: Upload distributions for publishing
        if: inputs.upload_dist
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
