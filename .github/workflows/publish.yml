name: Publish to PyPI

on:
  workflow_dispatch:

concurrency:
  group: pypi-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the declared version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "run this workflow from ${DEFAULT_BRANCH}, not ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Read the version from pyproject.toml
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from check_wheel import declared_version

          version = declared_version(Path.cwd())
          if not version[:1].isdigit():
              raise SystemExit(f"unexpected project version: {version!r}")
          print(f"publishing {version} from {Path.cwd()}")
          PY

  build:
    name: Validate and build the distributions
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      upload_dist: true
    permissions:
      contents: read

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/nonebot-plugin-agent-chat
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
